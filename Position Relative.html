<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Info Layout</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#ffffff;
    }

    .container{
      width:537px;
      height:557px;
      background:#f3f3f3;
      position:relative;
      margin:20px auto;
    }

    .item{
      position:relative;
      width:420px;
      margin-left:70px;
    }

    .item1{
      top:55px;
    }

    .item2{
      top:120px;
    }

    .item3{
      top:185px;
    }

    .icon{
      position:absolute;
      left:0;
      top:0;
      font-size:38px;
      color:#9a9a9a;
      width:50px;
      text-align:center;
    }

    .text{
      position:relative;
      left:70px;
    }

    .title{
      font-size:24px;
      font-weight:bold;
      color:#222;
      margin-bottom:10px;
      line-height:1.3;
    }

    .subtitle{
      font-size:18px;
      color:#8c8c8c;
      line-height:1.6;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="item item1">
      <div class="icon">⌂</div>
      <div class="text">
        <div class="title">Buttonwood, California.</div>
        <div class="subtitle">Rosemead, CA 91770</div>
      </div>
    </div>

    <div class="item item2">
      <div class="icon">📱</div>
      <div class="text">
        <div class="title">+1 253 565 2365</div>
        <div class="subtitle">Mon to Fri 9am to 6pm</div>
      </div>
    </div>

    <div class="item item3">
      <div class="icon">✉</div>
      <div class="text">
        <div class="title">support@colorlib.com</div>
        <div class="subtitle">Send us your query<br>anytime!</div>
      </div>
    </div>

  </div>

</body>
</html>
