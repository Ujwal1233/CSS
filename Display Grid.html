<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .item1{
            height: 200px;
            width: 200px;
            background-color: yellow;
        }
        .item2{
            height: 200px;
            width: 200px;
            background-color: red;
        }
        .item3{
            height: 200px;
            width: 200px;
            background-color: rgb(0, 17, 255);
        }
        .container{
            display: grid;
            grid-template-rows:200px 300px 300px;
            /* grid-template-columns: 200px 200px 200px; */
            gap: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
    </div>
</body>
</html>
