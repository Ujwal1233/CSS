<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 20px;
            position: sticky;
            top: 0;
        }
        .content{
            height: 2000px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        Sticky header
    </header>
    <div class="content">
        scroll down to see the header sticky at the top
    </div>
</body>
</html>
