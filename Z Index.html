<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width: 400px;
            height: 300px;
            border: 5px solid red;
            position: relative;
            left: 500px;
            top: 200px;
        }
        .child{
            height: 150px;
            width: 150px;
            position: absolute;
        }
        #box1{
           background-color: red;
           top: 80px;
           left: 80px;
           z-index: 1;
           background-image: url(car1.jpg);
        }
        #box2{
           background-color: blue;
              top: 160px;
           left: 160px;
           z-index: 2;
           background-image: url(car2.jpg);
        }
        #box3{
            background-color: green;
               top: 240px;
           left: 240px;
           z-index: 3;
           background-image: url(pool.jpg);
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child" id="box1">box 1</div>
     <div class="child" id="box2">box 2</div>
    <div class="child" id="box3">box 3</div>
    </div>
</body>
</html>
