<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            background-color:rgb(193, 193, 17);
            padding: 15px;
        }
        .title{
            display: grid;
            align-items: center;
            justify-items: center;
        }
        body{
            background-color: aquamarine;
        }
        .body{
            display: grid;
            grid-template-columns: 200px 200px 5px;
            gap: 20px;
            margin-top: 20px;
        }
        .one1{
            height: 500px;
            width: 200px;
            background-color: azure;
            gap: 20px;


        }
        .one2{
            height: 200px;
            width: 200px;
            background-color: blanchedalmond;
            gap: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="title">
            <h1>Image Gallery</h1>
        </div>
    </header>
    <main>
        <div class="body"></div>
        <div class="one1"></div>
        <div class="one2"></div>

    </main>
</body>
</html>
